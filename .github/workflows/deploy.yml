name: Deploy to Windows VPS

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos na VPS Windows
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true 
          script: |
            powershell -Command "cd 'C:\Users\Administrator\Documents\sampa-concept-main'; git pull origin main; npm install; npm run build; pm2 restart sampa-concept"
